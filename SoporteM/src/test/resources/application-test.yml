spring:
  datasource:
    url: jdbc:h2:mem:soporteDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: root
    password: ""
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

usuario:
  service:
    url: http://localhost:8081
